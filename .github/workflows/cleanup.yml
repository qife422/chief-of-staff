name: cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove editor test files
        run: |
          if [ -f cm-test.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q cm-test.html cm-test2.html .github/workflows/cleanup.yml
            git commit -m "Remove editor test files [skip ci]"
            git push
          fi
