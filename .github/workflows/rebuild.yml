name: rebuild
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rebuild.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat parts/part*.txt > index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -q parts/part*.txt .github/workflows/rebuild.yml
          git commit -m "Rebuild index.html from parts (V1+V3 fixes)"
          git push
