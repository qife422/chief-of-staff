name: concat-parts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  concat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html from parts
        run: |
          if [ -f parts/part7.txt ]; then
            cat parts/part1.txt parts/part2.txt parts/part3.txt parts/part4.txt parts/part5.txt parts/part6.txt parts/part7.txt > index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q parts/part1.txt parts/part2.txt parts/part3.txt parts/part4.txt parts/part5.txt parts/part6.txt parts/part7.txt .github/workflows/concat.yml
            git add index.html
            git commit -m "Assemble index.html [skip ci]"
            git push
          fi
